name: Enforce MAO Identity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  identity:
    name: MAO identity
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact proposed commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Reject every non-MAO actor or commit identity
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          readonly expected_actor='MAO-TLs'
          readonly expected_name='MAO Translations'
          readonly expected_email='MAO-TLs@users.noreply.github.com'
          readonly zero='0000000000000000000000000000000000000000'

          if [[ "$ACTOR" != "$expected_actor" ]]; then
            echo 'Rejected: only MAO-TLs may propose repository changes.' >&2
            exit 1
          fi

          if [[ "$EVENT_NAME" == 'pull_request' ]]; then
            mapfile -t commits < <(git rev-list "$BASE_SHA..$HEAD_SHA")
          elif [[ -z "${BEFORE_SHA:-}" || "$BEFORE_SHA" == "$zero" ]]; then
            # A new branch has no remote parent range. Verify the pushed tip
            # itself instead of traversing the repository's inherited history.
            commits=("$AFTER_SHA")
          else
            mapfile -t commits < <(git rev-list "$BEFORE_SHA..$AFTER_SHA")
          fi
          if (( ${#commits[@]} == 0 )); then
            echo 'Rejected: no commits were available for identity verification.' >&2
            exit 1
          fi

          for commit in "${commits[@]}"; do
            author_name=$(git show -s --format='%an' "$commit")
            author_email=$(git show -s --format='%ae' "$commit")
            committer_name=$(git show -s --format='%cn' "$commit")
            committer_email=$(git show -s --format='%ce' "$commit")

            if [[ "$author_name" != "$expected_name" || "$author_email" != "$expected_email" ]]; then
              echo "Rejected commit $commit: author must use the MAO-TLs identity." >&2
              exit 1
            fi

            if [[ "$committer_name" != "$expected_name" || "$committer_email" != "$expected_email" ]]; then
              # GitHub rewrites committer metadata when MAO-TLs uses its own
              # rebase-merge button. Accept that generated identity only when
              # GitHub itself associates the commit with the MAO-TLs account.
              linked_committer=$(curl --fail --silent --show-error \
                --header "Authorization: Bearer $GH_TOKEN" \
                --header 'X-GitHub-Api-Version: 2022-11-28' \
                "$API_URL/repos/$REPOSITORY/commits/$commit" | jq -r '.committer.login // empty')
              if [[ "$linked_committer" != "$expected_actor" ]]; then
                echo "Rejected commit $commit: committer is not linked to MAO-TLs." >&2
                exit 1
              fi
            fi
          done

          echo "Verified ${#commits[@]} MAO-authored commit(s)."
